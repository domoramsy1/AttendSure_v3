# AttendSure Deploy - Nginx Reverse Proxy & Web Portal Configuration
# File: D:\AttendSure_V3\deploy\nginx.conf

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Active upstream: Blue (web_blue:8001) or Green (web_green:8002)
    upstream attendsure_backend {
        server web_blue:8001;
    }

    server {
        listen 80;
        server_name api.attendsure.ph macasandig.attendsure.com.ph localhost _;

        client_max_body_size 15M;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://unpkg.com; font-src 'self' data:; connect-src 'self' https://*.tile.openstreetmap.org https://server.arcgisonline.com; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Django API routes
        location /api/ {
            proxy_pass http://attendsure_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Django Admin routes
        location /admin/ {
            proxy_pass http://attendsure_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Django collected static files (does not collide with Vite /assets/)
        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Uploaded student/teacher photos and exit pass attachments
        location /media/ {
            alias /app/media/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Hashed Vite frontend bundles (long-term immutable cache)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Always revalidate SPA entry point so deployments take effect immediately
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://unpkg.com; font-src 'self' data:; connect-src 'self' https://*.tile.openstreetmap.org https://server.arcgisonline.com; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        }

        # Compiled React SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
