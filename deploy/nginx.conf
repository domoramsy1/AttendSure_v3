# D:\AttendSure_V3\deploy\nginx.conf

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Active upstream: Blue (web_blue:8001) or Green (web_green:8002)
    upstream attendsure_backend {
        server web_blue:8001;
    }

    server {
        listen 80;
        server_name api.attendsure.ph macasandig.attendsure.com.ph localhost _;

        client_max_body_size 15M;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location /media/ {
            alias /app/media/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            proxy_pass http://attendsure_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}