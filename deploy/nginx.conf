events {
    worker_connections 2048;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Upstream pointing to either Blue (8001) or Green (8002)
    upstream attendsure_backend {
        server 127.0.0.1:8001; # Default: Blue
    }

    server {
        listen 80;
        server_name api.attendsure.ph 10.16.115.49;

        client_max_body_size 20M;

        location / {
            proxy_pass http://attendsure_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Zero-downtime timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}