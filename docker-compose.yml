# AttendSure Deploy - Docker Compose Services
# File: D:\AttendSure_V3\docker-compose.yml

# D:\AttendSure_V3\docker-compose.yml

services:
  redis:
    image: redis:7.2-alpine
    container_name: attendsure_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change_this_redis_password}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_this_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  db:
    image: postgres:16-alpine
    container_name: attendsure_db
    environment:
      POSTGRES_DB: ${DB_NAME:-attendsure_v3_db}
      POSTGRES_USER: ${DB_USER:-attendsure_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-attendsure_admin} -d ${DB_NAME:-attendsure_v3_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web_blue:
    build: ./backend
    container_name: attendsure_web_blue
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=8001
      - GUNICORN_BIND=0.0.0.0:8001
      - SECRET_KEY=${SECRET_KEY:-replace_with_strong_64_char_production_secret_key}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-attendsure_v3_db}
      - DB_USER=${DB_USER:-attendsure_admin}
      - DB_PASSWORD=${DB_PASSWORD:-change_this_db_password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change_this_redis_password}@redis:6379/0
      - USE_REDIS_CACHE=True
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  web_green:
    build: ./backend
    container_name: attendsure_web_green
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=8002
      - GUNICORN_BIND=0.0.0.0:8002
      - SECRET_KEY=${SECRET_KEY:-replace_with_strong_64_char_production_secret_key}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-attendsure_v3_db}
      - DB_USER=${DB_USER:-attendsure_admin}
      - DB_PASSWORD=${DB_PASSWORD:-change_this_db_password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change_this_redis_password}@redis:6379/0
      - USE_REDIS_CACHE=True
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    container_name: attendsure_nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web_blue
    restart: always

  celery_worker:
    build: ./backend
    container_name: attendsure_celery_worker
    command: celery -A config worker -l info --concurrency=4
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - SECRET_KEY=${SECRET_KEY:-replace_with_strong_64_char_production_secret_key}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-attendsure_v3_db}
      - DB_USER=${DB_USER:-attendsure_admin}
      - DB_PASSWORD=${DB_PASSWORD:-change_this_db_password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change_this_redis_password}@redis:6379/0
      - USE_REDIS_CACHE=True
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery_beat:
    build: ./backend
    container_name: attendsure_celery_beat
    command: celery -A config beat -l info
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - SECRET_KEY=${SECRET_KEY:-replace_with_strong_64_char_production_secret_key}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-attendsure_v3_db}
      - DB_USER=${DB_USER:-attendsure_admin}
      - DB_PASSWORD=${DB_PASSWORD:-change_this_db_password}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change_this_redis_password}@redis:6379/0
      - USE_REDIS_CACHE=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  redis_data:
  postgres_data:
  media_data:
  static_data:
